name: 'Custom Composite Action with Cached Dependencies'
description: 'A Composite Action that caches dependencies and runs a custom script.'
runs:
  using: 'composite'
  steps:
    - name: Cache Node.js modules
      id: cache-node-modules
      uses: actions/cache@v3
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}  
    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash