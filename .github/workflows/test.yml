name: Test Action
on:
  push:
    branches:
      - dev
    paths:
      - '**.ts'
      - '**.js'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    types: 
      - opened
      - synchronize
      - reopened
    branches:
      - main
  workflow_dispatch:
    branches:
      - main
  issues:
    types: [opened, edited, reopened]
  # schedule:
  #   - cron: '0 0 * * 0' # Runs every Sunday at midnight
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/
  
