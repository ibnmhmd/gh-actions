name: Test Action
on:
  push:
    branches:
      - dev
    paths:
      - '**.ts'
      - '**.js'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    types: 
      - opened
      - synchronize
      - reopened
    branches:
      - main
  issues:
    types: [opened, edited, reopened]
  # schedule:
  #   - cron: '0 0 * * 0' # Runs every Sunday at midnight
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}  
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.publish-name.outputs.script-file }}
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}  
      - name: Echo OS info
        run: uname -a
      - name: Echo Runner info
        run: echo $RUNNER_OS
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Publish JS filename
        id: publish-name
        run: find dist/src/*.js -type f -execdir echo 'script-file={}' >> $GITHUB_OUTPUT ';'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          # path: |
          #   dist/**
          #   .github/workflows/**
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - name: Show artifacts content
        run: ls
      - name: Use exported built script file
        run: echo "${{ needs.build.outputs.script-file }}"
      - name: Deploy to Production
        run: echo "Deploying to production server..."
        # Add your deployment commands here
  
